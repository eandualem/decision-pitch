[project]
name = "decision-pitch"
version = "0.1.0"
description = "Fast decision models play a real-time 3D soccer match, managed by language models."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.27",
    "pillow>=11",
    "python-dotenv>=1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
decision-pitch = "decision_pitch.server:main"

[dependency-groups]
dev = ["httpx2>=2.13", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
